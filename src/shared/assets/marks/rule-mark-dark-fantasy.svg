<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Grimoria rule mark</title>
  <!-- Rule mark, dark-fantasy execution: the ornament at the center of a section divider; the line
       is a CSS border on either side, per design/marks.md.
       Color: override the CSS custom properties logo-ink, logo-edge, logo-scuff. -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .grimoria-rule-halo { animation: grimoria-rule-halo-pulse 2.6s ease-in-out infinite; }
      .grimoria-rule-rim { animation: grimoria-rule-rim-pulse 2.6s ease-in-out infinite; }
      .grimoria-rule-ink { animation: grimoria-rule-ink-pulse 2.6s ease-in-out infinite; }
    }
    @keyframes grimoria-rule-halo-pulse {
      0%, 100% { opacity: .22; }
      50% { opacity: .9; }
    }
    @keyframes grimoria-rule-rim-pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes grimoria-rule-ink-pulse {
      0%, 100% { fill: var(--logo-ink, #C0453C); }
      50% { fill: color-mix(in srgb, var(--logo-ink, #C0453C) 55%, var(--logo-edge, #FFB4AB)); }
    }
  </style>
  <defs>
    <filter id="grimoria-rule-halo" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="grimoria-rule-rim" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
