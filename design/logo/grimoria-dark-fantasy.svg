<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Grimoria</title>
  <!-- Grimoria brand mark, dark-fantasy execution.
       Same skeleton as grimoria-standard.svg, inscribed by hand: the contour wanders, the
       weight breathes, and the edge is worn — hardest at the corners, where the five rubbed
       patches sit. Flat ink, lit faintly along its own contour.
       Worn ink moves toward the ground it sits on, so on this dark Chrome the patches
       darken; the reference's greys lighten only because its ground is white paper.
       Colour: override the CSS custom properties logo-ink, logo-edge, logo-scuff.
       See design/logo.md. -->
